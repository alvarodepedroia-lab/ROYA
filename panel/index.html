<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Staff | ROYA</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <section id="login">
      <img src="../roya-logo.png" alt="ROYA">
      <h1>Ingreso Staff</h1>
      <form id="login-form">
        <label>Usuario <input id="user" type="text" autocomplete="username" autocapitalize="none" required></label>
        <label>Contraseña <input id="pass" type="password" autocomplete="current-password" required></label>
        <button type="submit">Ingresar</button>
      </form>
      <p id="login-msg" role="alert"></p>
    </section>

    <section id="panel" hidden>
      <header>
        <img src="../roya-logo.png" alt="ROYA">
        <b>Bandeja WhatsApp</b>
        <button id="out" type="button">Cerrar sesión</button>
      </header>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar nombre, teléfono, solicitud o servicio">
        <label class="check"><input id="only-human" type="checkbox"> Solo los que requieren atención</label>
      </div>
      <div class="grid">
        <aside id="list"></aside>
        <article id="detail"><p class="hint">Seleccioná una conversación.</p></article>
      </div>
    </section>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
